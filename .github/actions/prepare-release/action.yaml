name: Prepare Release

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: make-generate
      shell: bash
      run: |
        set -euo pipefail

        # workaround bug in vgopath-setup.sh. Can be droppede again after revendoring
        # gardener/gardener
        mkdir -p $HOME/go
        export GOPATH=$HOME/go

        make generate
